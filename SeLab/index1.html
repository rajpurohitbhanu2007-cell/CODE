<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Table</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            padding: 20px;
        }

        table {
            width: 800px;
            border: 4px double black;
            border-spacing: 4px;
            padding: 5px;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            font-size: 22px;
            text-align: left;
        }

        th {
            text-align: center;
        }

        .heading {
            width: 130px;
        }

        .student-list {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th rowspan="2" class="heading">Heading</th>
            <th>Students</th>
            <th colspan="3">Details</th>
        </tr>

        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Department</th>
            <th>Roll Number</th>
        </tr>

        <tr>
            <td rowspan="4" class="student-list">Student List</td>
            <td>1</td>
            <td>Victor</td>
            <td>Computer Science</td>
            <td>12345</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Williams</td>
            <td>Electronics</td>
            <td>23456</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Harry</td>
            <td>Electrical</td>
            <td>34567</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Rick</td>
            <td>Civil</td>
            <td>45678</td>
        </tr>
    </table>

</body>
</html>
